"brew:forgejo-cli" = "latest"
"brew:fswatch" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:gifsicle" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-sizer" = "latest"
"brew:glances" = "latest"
