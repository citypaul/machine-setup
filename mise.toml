# Base layer, loaded on every machine. Load order, later wins per key (plan.md §4.9):
#   mise.toml < mise.<os>.toml < mise.<profile>.toml < mise.<role>.toml … < mise.machine-<id>.toml
# Group lists replace rather than union, so every role and machine file states its complete list.
# The per-machine selection lives in .miserc.local.toml and mise.local.toml, written by bootstrap.sh.

[dotfile_groups.zsh]
root = "zsh"

[dotfile_groups.ghostty]
root = "ghostty"

# Global mise config fragment (runtimes, settings), default npm packages, environment.d for GUI apps.
[dotfile_groups.mise]
root = "mise"

[bootstrap]
dotfile_groups = ["zsh", "mise"]

# nvm is retired (slice 3): remove the lazy-loader an older setup linked into the home directory.
[dotfiles]
"~/.nvm_setup" = { mode = "absent" }

# CLI tools for every machine, Homebrew bottles poured by mise on both OSes (plan D4).
# Ported from mac-dev-machine-setup/Brewfile.cli. Not here on purpose: agent-browser, gemini-cli
# and herdr (they pull Homebrew's node; slices 3 and 5 give them the npm backend), terraform
# (a mise tool below, the tap formula would be a source build), omp and quien (obscure taps,
# deferred: ADR 0001).
[bootstrap.packages]
"brew:act" = "latest"
"brew:adr-tools" = "latest"
"brew:age" = "latest"
"brew:asciinema" = "latest"
