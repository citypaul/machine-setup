# Base layer, loaded on every machine. Load order, later wins per key (plan.md §4.9):
#   mise.toml < mise.<os>.toml < mise.<profile>.toml < mise.<role>.toml … < mise.machine-<id>.toml
# Group lists replace rather than union, so every role and machine file states its complete list.
# The per-machine selection lives in .miserc.local.toml and mise.local.toml, written by bootstrap.sh.

[dotfile_groups.zsh]
root = "zsh"

[dotfile_groups.ghostty]
root = "ghostty"

[dotfile_groups.alacritty]
root = "alacritty"

# Global mise config fragment (runtimes, settings), default npm packages, environment.d for GUI apps.
[dotfile_groups.mise]
root = "mise"

# Identity (plan §4.6): git config rendered per profile, GPG files as private copies with this OS's
# pinentry, ssh config with the 1Password agent where it exists, the YubiKey-aware signing wrapper.
[dotfile_groups.git]
root = "git"
[dotfile_groups.git.entries]
"~/.gitconfig" = { source = "gitconfig.tera", mode = "template", permissions = "0644" }

[dotfile_groups.gnupg]
root = "gnupg"
[dotfile_groups.gnupg.entries]
"~/.gnupg/gpg.conf" = { mode = "copy", permissions = "0600" }
"~/.gnupg/gpg-agent.conf" = { source = ".gnupg/gpg-agent.conf.tera", mode = "template", permissions = "0600" }

[dotfile_groups.ssh]
root = "ssh"
[dotfile_groups.ssh.entries]
"~/.ssh/config" = { source = ".ssh/config.tera", mode = "template", permissions = "0600" }

[dotfile_groups.bin]
root = "bin"

# Terminal multiplexers and the herdr workspace manager (citypaul/.dotfiles tmux/, zellij/, herdr/).
[dotfile_groups.tmux]
root = "tmux"

[dotfile_groups.zellij]
root = "zellij"

[dotfile_groups.herdr]
root = "herdr"

[bootstrap]
dotfile_groups = ["zsh", "mise", "git", "gnupg", "ssh", "bin", "tmux", "zellij", "herdr"]

[bootstrap.directories."~/.gnupg"]
mode = "0700"
[bootstrap.directories."~/.ssh"]
mode = "0700"
[bootstrap.directories."~/.ssh/config.d"]
mode = "0700"

# nvm is retired (slice 3): remove the lazy-loader an older setup linked into the home directory.
[dotfiles]
"~/.nvm_setup" = { mode = "absent" }

# Checkouts the shell and editor configs expect (mac-dev-machine-setup zsh.yaml, nvim.yaml). mise clones
# them when missing and otherwise leaves them alone; URLs match the checkouts already on Paul's Macs.
# NvChad is pinned to the v2.0 commit the existing config runs; that branch is frozen upstream (ADR 0001 D-29).
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.config/nvim" = { url = "https://github.com/NvChad/NvChad", ref = "3091ea58359bb85f087499bd73fbc0a57a935c34" }   # the v2.0 commit Paul runs; a branch ref never reads as current on a fresh clone (F-39)

# CLI tools for every machine, Homebrew bottles poured by mise on both OSes (plan D4).
# Ported from mac-dev-machine-setup/Brewfile.cli. Not here on purpose: agent-browser, gemini-cli
# and herdr (they pull Homebrew's node; slices 3 and 5 give them the npm backend), terraform
# (a mise tool below, the tap formula would be a source build), omp and quien (obscure taps,
# deferred: ADR 0001).
