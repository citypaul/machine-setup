# Removal is an explicit allowlist, composed from one var per layer (plan §4.4, ADR 0001 F-11).
# The base lists are the legacy "remove if installed" lists from mac-dev-machine-setup/defaults.yaml.
[vars]
# Git identity. One address for every profile; `bootstrap.sh --git-email` overrides it per machine
# through mise.local.toml (ADR 0001 D-20). Profile files must not set it, or the override cannot win.
git_name = "Paul Hammond"
git_email = "paul.hammond@gmail.com"
# Exact reviewed release of citypaul/.dotfiles for CLAUDE.md, skills and agents (plan §4.7).
claude_skills_version = "v4.18.0"
# Config environments whose bootstrap needs 1Password signed in; bootstrap.sh drops them from a run
# when `op whoami` fails and says so. None today: Conquer joins by OIDC (D6).
secret_envs = ""
remove_brew_base = "neofetch exa"
remove_cask_base = "adguard arc bartender devtoys granola handy hiddenbar ngrok orbstack pgadmin4 rewind snagit spokenly unclack utm visual-studio-code@insiders wezterm whisky zotero"
remove_cask_zap_base = "karabiner-elements"
remove_mas_base = "457622435"   # Yoink

# Extra arguments to `mise run remove-packages` (for example --dry-run) are appended by mise.
[tasks.remove-packages]
description = "Remove packages on this machine's removal allowlist; never prunes"
run = '''tasks/remove-packages \
  --brew "{{ vars.remove_brew_base | default(value='') }} {{ vars.remove_brew_profile | default(value='') }} {{ vars.remove_brew_machine | default(value='') }}" \
  --cask "{{ vars.remove_cask_base | default(value='') }} {{ vars.remove_cask_profile | default(value='') }} {{ vars.remove_cask_machine | default(value='') }}" \
  --zap "{{ vars.remove_cask_zap_base | default(value='') }} {{ vars.remove_cask_zap_profile | default(value='') }} {{ vars.remove_cask_zap_machine | default(value='') }}" \
  --mas "{{ vars.remove_mas_base | default(value='') }} {{ vars.remove_mas_profile | default(value='') }} {{ vars.remove_mas_machine | default(value='') }}" \
  --apt "{{ vars.remove_apt_base | default(value='') }} {{ vars.remove_apt_profile | default(value='') }} {{ vars.remove_apt_machine | default(value='') }}"'''

[tasks.merge-claude-settings]
description = "Merge claude/settings.json into ~/.claude/settings.json, keeping other hooks (plan §4.7)"
# After the skills installer: its `claude plugin install` writes settings.json too, and the merge must
# land last so the repo's settings win; it keeps the keys it does not define (ADR 0001 F-57).
depends = ["claude-skills"]
run = "tasks/merge-claude-settings"

[tasks.install-browsers]
description = "Install the Chromium that agent-browser drives, once"
run = "tasks/install-browsers"

[tasks.claude-skills]
description = "Install CLAUDE.md, skills and agents from citypaul/.dotfiles at the pinned release"
run = 'tasks/claude-skills --version "{{ vars.claude_skills_version }}"'

[tasks.herdr-integrations]
description = "Install herdr's Claude Code and Codex integrations (best effort)"
depends = ["merge-claude-settings", "claude-skills"]
run = "tasks/herdr-integrations"

[tasks.gpg-setup]
description = "Import the public GPG keys; configure YubiKey commit signing when a key is inserted"
run = "tasks/gpg-setup"

[tasks.talat]
description = "Install Talat from its release feed, once (macOS, Apple Silicon, desktop role)"
run = "tasks/talat '{{ vars.roles | default(value='') }}'"

[tasks.doctor]
description = "The checks mise does not make: selection, drift, login shell, 1Password, Conquer, GPG card, skills pin"
run = "tasks/doctor"

[tasks.update]
description = "Upgrade on purpose: show the plan, then upgrade declared packages and tools with --yes"
run = "tasks/update"

[tasks.gh-extensions]
description = "Install the gh extensions (gh-stack) once gh is signed in"
run = "tasks/gh-extensions"

[tasks.bootstrap]
description = "Imperative setup that runs after tools on every bootstrap"
depends = ["merge-claude-settings", "install-browsers", "claude-skills", "herdr-integrations", "gpg-setup", "talat", "gh-extensions"]
run = "true"

[tasks.fix-brew-certs]
description = "Give mise-poured Homebrew TLS clients the CA bundle their post-install step would have made"
run = "tasks/fix-brew-certs"

[tasks.login-shell]
description = "Make zsh the login shell (sudo, never fails the run)"
run = "tasks/login-shell"

[bootstrap.hooks]
post-packages = ["mise run fix-brew-certs", "mise run remove-packages"]
post-dotfiles = "mise run login-shell"

[settings]
# `mise run` installs every tool the config declares before a task unless told otherwise, so the
# hooks below would pull node, rust, terraform and the npm agents into HOME during the packages and
# dotfiles phases (and during a migration). The tools phase owns installs (ADR 0001 F-35).
task.run_auto_install = false
