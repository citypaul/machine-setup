# macOS layer (selected automatically by auto_env).
[bootstrap.brew]
adopt = true   # keep an existing app bundle in place instead of replacing it (protects TCC grants)

# macOS-only CLI formulae, and the casks every Mac gets regardless of role: the password manager
# and its CLI, the terminal, the editor. The rest of the GUI inventory is the desktop role.
[bootstrap.packages]
"brew:colima" = "latest"
"brew:mas" = "latest"
"brew:mole" = "latest"
"brew:pinentry-mac" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:visual-studio-code" = "latest"

# GUI applications do not inherit the shell's PATH; a LaunchAgent sets the login session's PATH so
# apps started from the Dock or Spotlight see mise's shims and Homebrew (plan.md §4.5).
[bootstrap.macos.launchd.agents.machine-setup-path]
program = "/bin/launchctl"
args = ["setenv", "PATH", "{{ env.HOME }}/.local/share/mise/shims:{{ env.HOME }}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"]
run_at_load = true
process_type = "Background"

# Finder, keyboard and panel preferences (mac-dev-machine-setup/ansible/tasks/osx.yaml): mise's friendly
# sections where they exist, raw defaults for the rest. Defaults are not templated, so new Finder
# windows open at "home" (PfHm) instead of a per-user file:// path (ADR 0001 D-24). Not declared: the
# automatic software-update check (lives in /Library, needs admin rights, D8) and the Notification
# Center banner time (a sandboxed app's container; writing it needs Full Disk Access, F-40).
[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 0
automatic_spelling_correction = false

[bootstrap.macos.defaults]
"com.apple.finder" = { ShowExternalHardDrivesOnDesktop = true, ShowHardDrivesOnDesktop = true, ShowMountedServersOnDesktop = true, ShowRemovableMediaOnDesktop = true, _FXShowPosixPathInTitle = true, NewWindowTarget = "PfHm", FXDefaultSearchScope = "SCcf", EmptyTrashSecurely = true }
"NSGlobalDomain" = { AppleShowAllExtensions = true, AppleKeyboardUIMode = 3 }
"com.apple.LaunchServices" = { LSQuarantine = false }   # as before: no "are you sure you want to open" dialog
"com.apple.spotlight" = { DictionaryLookupEnabled = false }
"com.apple.Terminal" = { NewTabWorkingDirectoryBehavior = true }

[bootstrap.hooks]
post-defaults = ["chflags nohidden ~/Library", "killall Finder || true"]
