# macOS layer (selected automatically by auto_env).
[bootstrap.brew]
adopt = true   # keep an existing app bundle in place instead of replacing it (protects TCC grants)

# macOS-only CLI formulae, and the casks every Mac gets regardless of role: the password manager
# and its CLI, the terminal, the editor. The rest of the GUI inventory is the desktop role.
[bootstrap.packages]
"brew:colima" = "latest"
"brew:mas" = "latest"
"brew:mole" = "latest"
"brew:pinentry-mac" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:visual-studio-code" = "latest"

# GUI applications do not inherit the shell's PATH; a LaunchAgent sets the login session's PATH so
# apps started from the Dock or Spotlight see mise's shims and Homebrew (plan.md §4.5).
[bootstrap.macos.launchd.agents.machine-setup-path]
program = "/bin/launchctl"
args = ["setenv", "PATH", "{{ env.HOME }}/.local/share/mise/shims:{{ env.HOME }}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"]
run_at_load = true
process_type = "Background"
