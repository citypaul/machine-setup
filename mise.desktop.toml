# Role: a machine with a GUI. Roles state the complete group list (lists replace).
# On macOS this is the GUI inventory from mac-dev-machine-setup/Brewfile.gui, the fonts, and the
# App Store apps; Linux desktop apps arrive in slice 8 (plan D7). Not selected in CI or on the test
# VMs by default: the representative apps in mise.macos.toml cover the mechanism.
[bootstrap]
dotfile_groups = ["zsh", "ghostty"]

[bootstrap.packages]
"brew-cask:alacritty" = { os = "macos" }
"brew-cask:audio-hijack" = { os = "macos" }
"brew-cask:balsamiq-wireframes" = { os = "macos" }
