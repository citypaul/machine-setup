name: ci

# One run per pull request or branch: a new push replaces the queued run instead of adding to the
# macOS runner queue (47 stale runs were waiting on 2026-10-06).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

# Runners prove the mechanisms with the base inventory plus the Conquer role; the desktop role (fifty
# casks and MacTeX on a Mac) is evidence from the test VMs (ADR 0001 D-32).
env:
  MACHINE_SETUP_TEST_ROLES: conquer
  MACHINE_SETUP_TEST_MACHINE: ci

jobs:
  linux:
    name: ubuntu 24.04 container (clean, root)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ubuntu:24.04
    steps:
      # Only the test harness is pre-installed; bootstrap.sh must bring its own prerequisites.
      - run: apt-get update && apt-get install -y --no-install-recommends bats jq
      - uses: actions/checkout@v5
      - run: MACHINE_SETUP_ALLOW_MUTATION=1 test/run.sh
  macos:
    name: macos-15 runner (Homebrew present)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: brew install bats-core
      - run: MACHINE_SETUP_ALLOW_MUTATION=1 test/run.sh
