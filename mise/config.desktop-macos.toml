# Desktop role on macOS, selected automatically next to `desktop` (ADR 0001 D-14): the Dock and the
# iTerm2 profile. Everything here needs apps the role installs.

# Pinned applications in order (mac-dev-machine-setup/ansible/tasks/dock.yaml, minus the spacers
# mise has no notion of). mise owns the pinned-app tiles: it adds, removes and reorders them, and
# every path must exist when the Dock phase runs, which is before tasks. Slack is a cask in this role
# and Talat is installed by the post-dotfiles hook below, so both exist by then (D-38). Spotify and
# Brave (personal profile) are not here; they are in the per-machine Dock lists (D-25, D-33). Rex, the primary terminal, is a beta installed by
# hand into ~/Applications, so on a fresh machine it is not there yet and stays unpinned (D-37).
[bootstrap.macos.dock]
apps = [
  "/Applications/Slack.app",
  "/Applications/Fantastical.app",
  "/Applications/Alacritty.app",
  "/Applications/Ghostty.app",
  "/Applications/Cursor.app",
  "/Applications/Audio Hijack.app",
  "/Applications/Loopback.app",
  "/Applications/Google Chrome.app",
  "/Applications/Firefox.app",
  "/Applications/ResponsivelyApp.app",
  "/Applications/DeskPad.app",
  "/Applications/Bruno.app",
  "/Applications/TablePlus.app",
  "/Applications/Sourcetree.app",
  "/Applications/Raycast.app",
  "/Applications/ChatGPT.app",
  "/Applications/Claude.app",
  "/Applications/FluidVoice.app",
  "/Applications/Talat.app",
  "/Applications/Obsidian.app",
]

# iTerm2 reads dynamic profiles from this folder (mac-dev-machine-setup/ansible/tasks/iterm.yaml).
[bootstrap.directories."~/Library/Application Support/iTerm2/DynamicProfiles"]
mode = "0755"

[bootstrap.files."~/Library/Application Support/iTerm2/DynamicProfiles/machine-setup.json"]
source = "../files/iterm-dynamic-profile.json"
mode = "0644"

# Alacritty's font size on macOS; ~/.alacritty.toml imports it (ADR 0001 F-58).
[dotfiles]
"~/.config/alacritty/font-size.toml" = { content = """
[font]
size = 19
""", permissions = "0644" }

# Talat must exist before the Dock phase pins it, and the bootstrap task runs after that phase. The
# post-dotfiles hook is the last one before the Dock (F-35), so Talat is installed there. Hooks
# replace per key across files (F-37): this restates the base hook's login-shell step. Talat ships
# Apple Silicon builds only, so on an Intel Mac, or when its download fails, the Dock phase stops
# the run until /Applications/Talat.app exists (D-38).
[bootstrap.hooks]
post-dotfiles = ["mise run login-shell", "mise run talat"]
