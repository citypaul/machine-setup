# Machine-wide runtimes and mise settings, deployed to ~/.config/mise/conf.d by the `mise` dotfile
# group (plan.md §4.5, ADR 0001 F-19). It lives in conf.d so bootstrap's own writes to
# ~/.config/mise/config.toml (trusted paths) never touch a tracked file.

[tools]
node = "24"
terraform = "latest"
rust = "stable"
# CLIs that used to pull Homebrew's node formula; the npm backend gives them mise's node instead.
"npm:agent-browser" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@informalsystems/quint" = "latest"
# The old pnpm globals, as declared tools so a converge installs them too (ADR 0001 F-25).
"npm:task-master-ai" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
# Agent CLIs on both OSes (the macOS cask only covered one of them). mise's npm installer runs no
# install scripts unless allowed, and claude-code's own puts its native binary in place (ADR 0001 F-57).
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@openai/codex" = "latest"
# Oh My Pi ships a single binary per OS/arch on GitHub releases; the old `can1357/tap/omp` formula just
# downloaded it, so the github backend replaces a tap that mise would otherwise build (ADR 0001 D-22).
"github:can1357/oh-my-pi" = "latest"

# shortcut: mise 2026.11.12 drops the CLI cask's executable; use Google's release feed until that is fixed.
[tools."http:antigravity-cli"]
version = "latest"
version_list_url = "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/darwin_arm64.json"
version_regex = '/antigravity-cli/([^/]+)/'
prerelease = true   # Google's release directory includes a numeric build suffix after a hyphen
url = 'https://storage.googleapis.com/antigravity-public/antigravity-cli/{{ version }}/{{ os(macos="darwin") }}-{{ arch(arm64="arm") }}/cli_{{ os(macos="mac") }}_{{ arch() }}.tar.gz'
checksum_url = 'https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.json'
checksum_expr = 'fromJSON(body).url == url ? "sha512:" + fromJSON(body).sha512 : ""'
rename_exe = "agy"

[env]
AGY_CLI_DISABLE_AUTO_UPDATE = "true"   # mise owns CLI versions and upgrades

[settings]
# .nvmrc and .node-version switch node per directory, as nvm did; a missing version is installed
# on first use by mise's command-not-found handler (not_found_auto_install is on by default).
idiomatic_version_file_enable_tools = ["node"]
