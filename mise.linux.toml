# Linux layer (selected automatically by auto_env). System packages come from apt; CLI tools from
# Homebrew bottles poured by mise into /home/linuxbrew/.linuxbrew (plan D4, declared in mise.toml).
[bootstrap.packages]
"apt:zsh" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:jq" = "latest"
"apt:tree" = "latest"
# A C toolchain: rust (via mise) and some npm packages need a linker; macOS gets it from the CLT.
"apt:build-essential" = "latest"
"apt:pinentry-curses" = "latest"

# Login shell: zsh, so ssh and cron get .zshenv/.zprofile (plan.md §4.5). Done by tasks/login-shell
# (post-dotfiles hook below) rather than [bootstrap.user], whose unprivileged chsh needs a password.

[tasks.session-path]
description = "Push mise's PATH into the running systemd user session for GUI apps"
run = "tasks/session-path"

[bootstrap.hooks]
post-dotfiles = ["mise run session-path", "mise run login-shell"]
